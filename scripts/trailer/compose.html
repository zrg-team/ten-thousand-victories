<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>trailer compositor</title>
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>html,body{margin:0;background:#2a2118}canvas{display:block}</style>
</head>
<body>
<canvas id="sheet"></canvas>
<script type="module">
import { encodeQr } from '/src/utils/qr.ts';

/**
 * The compositor.
 *
 * The capture stage photographs the game at 1170x2080 and knows nothing about lettering. This page
 * takes one of those frames and lays the film over it: the crop (a slow push in or out, done here
 * so the game camera never has to re-bake the ground for a zoom), the dip to paper between cuts,
 * the caption, and the ink ring where a thumb went down.
 *
 * Everything is drawn in the game's own materials — dieellip paper, muc soot, soi son red, Source
 * Serif for the lettering — because a caption set in a UI font over a woodblock print looks like a
 * subtitle track, not like part of the game.
 */
const PIGMENT = {
  diep: '#e9dfc2',
  diepHi: '#f3ecd8',
  diepLo: '#d8c9a4',
  muc: '#2a2118',
  mucSoft: '#5a4c39',
  mucFaint: '#8c7e67',
  son: '#b33a26',
  sonDeep: '#8a2a1b',
};

const W = 1080;
const H = 1920;
const SRC_W = 1170;                  // what the capture stage hands us
const canvas = document.getElementById('sheet');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d', { alpha: false });

const image = new Image();
let loaded = null;

/**
 * The river emblem, the same file the launch splash preloads and the menu draws.
 *
 * Loaded once at start-up so the opening card can be drawn on any frame without a fetch in the
 * middle of the composite.
 */
const emblem = new Image();
const emblemReady = new Promise((resolve) => {
  emblem.onload = () => resolve(true);
  emblem.onerror = () => resolve(false);
  emblem.src = '/app-emblem.webp';
});

function load(dataUrl) {
  return new Promise((resolve, reject) => {
    image.onload = () => { loaded = dataUrl; resolve(); };
    image.onerror = reject;
    image.src = dataUrl;
  });
}

/** The sawtooth the game prints along the edge of every band. */
function sawtooth(x, y, width, height, colour, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = colour;
  const step = height * 1.5;
  for (let at = x; at < x + width; at += step) {
    ctx.beginPath();
    ctx.moveTo(at, y + height);
    ctx.lineTo(at + step / 2, y);
    ctx.lineTo(at + step, y + height);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/**
 * A caption, set on the paper rather than in a bar.
 *
 * The halo is what makes this work over a printed ground: the same line is stroked wide in paper
 * underneath itself, twice, so the letters carry their own sheet and never need a band drawn over
 * the gameplay. A soi son rule sits under the block, which is the mark the game uses to say "the
 * player's own".
 */
function caption(spec) {
  const { line, line2, alpha, plate } = spec;
  // The plate can be up while the lettering is at zero — that is the hand-over between two lines
  // on the same sheet — so the band is drawn on `plate`, not on `alpha`.
  if (!line || (alpha <= 0 && !(plate > 0))) return;
  const lines = line2 ? [line, line2] : [line];
  return spec.band
    ? captionBand(lines, alpha, spec.band, plate ?? alpha)
    : captionFloating(lines, alpha, spec.y);
}

/**
 * Sets a line at `size`, or at whatever smaller size makes it fit the sheet.
 *
 * The game's own InkUI does this to every label it draws and the reason is the same here: a caption
 * is written in two languages and the shorter one is not always the English. Vietnamese carries its
 * diacritics in the same advance width but its words are rarely the same length, so a line that sat
 * comfortably in one language can run off the paper in the other. Measuring costs nothing and means
 * a caption can never be written badly enough to overflow.
 */
function fitFont(text, size, family, maxWidth) {
  ctx.font = `700 ${size}px ${family}`;
  const width = ctx.measureText(text).width;
  if (width <= maxWidth) return;
  ctx.font = `700 ${Math.floor(size * (maxWidth / width))}px ${family}`;
}

/**
 * Over open ground: no bar, just the letters carrying their own paper.
 *
 * The halo is what makes this work over a print. The line is stroked wide in dieellip underneath
 * itself, twice, so it never needs a band drawn over the country. A soi son rule closes the block —
 * the mark this game reserves for the player's own.
 */
function captionFloating(lines, alpha, y) {
  // Comes down a little as it arrives, so it settles into the country rather than appearing on it.
  const eased = 1 - Math.pow(1 - Math.min(1, Math.max(0, alpha)), 3);
  const top = H * (y ?? 0.735) - (1 - eased) * 44;
  const lead = 68;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach((text, i) => {
    const at = top + i * lead;
    fitFont(text, 56, '"Source Serif 4", Georgia, serif', W - 120);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = PIGMENT.diep;
    ctx.globalAlpha = alpha * 0.92;
    ctx.lineWidth = 22;
    ctx.strokeText(text, W / 2, at);
    ctx.lineWidth = 12;
    ctx.strokeText(text, W / 2, at);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PIGMENT.muc;
    ctx.fillText(text, W / 2, at);
  });
  ctx.globalAlpha = alpha * 0.85;
  ctx.fillStyle = PIGMENT.son;
  ctx.fillRect(W / 2 - 54, top + lines.length * lead - 22, 108, 3);
  ctx.restore();
}

/**
 * Over a screen that is already full — a card, a sheet, a field with two dials under it.
 *
 * There is no empty corner on those, and a halo over the middle of a card hides the one thing the
 * cut is there to show. So the line goes on a sheet of its own at the top edge, sawtooth along the
 * bottom the way every band in this game is cut. It reads as a chapter rather than a subtitle, and
 * the only thing it covers is the resource header, which the map cuts have already shown.
 */
function captionBand(lines, alpha, kind, plate) {
  // Three screens, two seams. The plate has to end where the game's own layout ends, or it puts a
  // sawtooth through the middle of a line and the text shows above it in halves:
  //
  //   'hud'  272 — the map and the prompt screens carry two rows, the resources and the power
  //                strip, and the paper changes tone under both.
  //   'top'  140 — the fight carries one row and starts its commander plate straight under it;
  //                so does a lane page, whose own title begins at 210.
  //
  // The short plate holds one line. That is a real constraint on the writing and a good one: a
  // single line over a fight is better than two.
  const height = kind === 'hud' ? 272 : 140;
  // The short plate can hold two lines, but not at the tall plate's size — 140 units is the seam
  // and the type has to live inside it. This is what lets a cut carry one caption that holds for
  // four seconds instead of two that swap in the middle of it.
  const twoUp = kind !== 'hud' && lines.length > 1;
  const size = twoUp ? 42 : 48;
  const lead = twoUp ? 50 : 58;
  const first = height / 2 - ((lines.length - 1) * lead) / 2;
  const t = Math.min(1, Math.max(0, alpha));

  // **The plate does not move. The lettering slides down inside it.**
  //
  // The obvious animation — slide the whole plate down from above the top edge — is wrong here, and
  // wrong in exactly the way the static version was: for the five frames its bottom edge is
  // travelling, that edge is *across* the resource row, and a frame caught then shows the header
  // cut in half with its top under paper. It is the artefact the seams were measured to remove,
  // reintroduced as motion.
  //
  // So the paper arrives at its seam and stays there — over three frames, fast enough that nothing
  // underneath is ever legible through it — and the line of type slides down into it behind a clip.
  // Same read as a plate coming down, and the edge never crosses anything.
  // The paper follows the *run* of captions, not this one line, so it stays up while one line
  // hands over to the next. It still arrives fast — three frames — so nothing underneath is ever
  // legible through it.
  const paper = Math.min(1, Math.max(0, plate) * 6);
  const eased = 1 - Math.pow(1 - t, 3);

  ctx.save();
  ctx.globalAlpha = paper;
  ctx.fillStyle = PIGMENT.diep;
  ctx.fillRect(0, 0, W, height);
  sawtooth(0, height, W, 15, PIGMENT.muc, paper * 0.45);
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, height);
  ctx.clip();
  ctx.translate(0, (1 - eased) * -46);
  ctx.globalAlpha = t;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = PIGMENT.muc;
  lines.forEach((text, i) => {
    fitFont(text, size, '"Source Serif 4", Georgia, serif', W - 96);
    ctx.fillText(text, W / 2, first + i * lead);
  });
  ctx.restore();
}

/** Where a thumb went down: two rings of soi son opening and fading, the way the game marks a tap. */
function ripple(spec, scale, cropX, cropY) {
  const { dx, dy, age } = spec;
  if (age > 1) return;
  const x = (dx * 3 - cropX) * scale;
  const y = (dy * 3 - cropY) * scale;
  ctx.save();
  for (let ring = 0; ring < 2; ring += 1) {
    const u = Math.max(0, Math.min(1, age - ring * 0.22));
    if (u <= 0 || u >= 1) continue;
    ctx.globalAlpha = (1 - u) * 0.85;
    ctx.strokeStyle = ring === 0 ? PIGMENT.son : PIGMENT.sonDeep;
    ctx.lineWidth = 6 - ring * 2;
    ctx.beginPath();
    ctx.arc(x, y, 22 + u * 92, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (age < 0.3) {
    ctx.globalAlpha = (1 - age / 0.3) * 0.5;
    ctx.fillStyle = PIGMENT.son;
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/**
 * The end card.
 *
 * The front page already carries the wordmark, the subtitle, the river plate and its falling
 * leaves — so this does not cover it with a title of its own. It lays a paper band over the bottom
 * third instead, which is where the page keeps its links, its language row and its build number,
 * and puts the three lines a trailer has to end on there.
 */
function endCard(alpha, lang) {
  if (alpha <= 0) return;
  // High enough to take the mode button with it. Leaving *Rồng Thăng Long* stranded above the paper
  // read as a band dropped onto a live menu; from here up the card is the wordmark, the river plate
  // and a sheet, which is a poster rather than a screenshot with a strip over it.
  const top = H * 0.46;
  const say = lang === 'vi'
    ? {
      pitch: ['Lịch sử Việt Nam,', 'trong tay bạn.'],
      ask: 'Triều đại của bạn đi được bao xa?',
      scan: 'Quét để chơi',
    }
    : {
      pitch: ['Vietnamese history,', 'in your hands.'],
      ask: 'How far would your reign get?',
      scan: 'Scan to play',
    };

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = PIGMENT.diep;
  ctx.fillRect(0, top, W, H - top);
  sawtooth(0, top, W, 18, PIGMENT.muc, 0.45);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = PIGMENT.muc;
  ctx.font = '700 54px "Source Serif 4", Georgia, serif';
  ctx.fillText(say.pitch[0], W / 2, top + 96);
  ctx.fillText(say.pitch[1], W / 2, top + 158);

  ctx.fillStyle = PIGMENT.mucSoft;
  ctx.font = '400 40px "Be Vietnam Pro", system-ui, sans-serif';
  ctx.fillText(say.ask, W / 2, top + 232);

  ctx.fillStyle = PIGMENT.son;
  ctx.fillRect(W / 2 - 90, top + 288, 180, 4);

  // The code, not a pair of store names.
  //
  // A trailer is watched on a screen nobody can tap — naming two stores in a video is asking the
  // viewer to remember a name and go looking. A code is the one thing a phone camera can act on
  // while the frame is still up, and it goes to a page that offers all three doors at once
  // (browser, Play, App Store) rather than making the viewer pick the right shop first.
  drawQr(PLAY_URL, W / 2, top + 350, 300, alpha);

  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = PIGMENT.muc;
  ctx.font = '600 40px "Be Vietnam Pro", system-ui, sans-serif';
  ctx.fillText(say.scan, W / 2, top + 706);
  ctx.font = '400 32px "Be Vietnam Pro", system-ui, sans-serif';
  ctx.fillStyle = PIGMENT.mucSoft;
  ctx.fillText('zrg-team.github.io/ten-thousand-victories', W / 2, top + 758);

  ctx.font = 'italic 600 36px "Source Serif 4", Georgia, serif';
  ctx.globalAlpha = alpha * 0.75;
  ctx.fillText('Nam quốc sơn hà Nam đế cư.', W / 2, top + 870);
  ctx.restore();
}

/** Where the code points: one page, three doors — the browser, Play, the App Store. */
const PLAY_URL = 'https://zrg-team.github.io/ten-thousand-victories/play/';

/**
 * The code, drawn by the game's own encoder rather than fetched from anywhere.
 *
 * `src/utils/qr.ts` is what the Support modal draws its Wise code with, so the trailer and the game
 * agree by construction and the film has no asset to keep in step. Quiet zone included — a code
 * printed hard against a border does not scan.
 */
function drawQr(text, cx, top, size, alpha) {
  const matrix = encodeQr(text, 'M');
  if (!matrix) return;
  const quiet = 4;   // the spec's margin; a code printed tighter than this is a code that may not read
  const span = matrix.size + quiet * 2;
  const cell = size / span;
  const x0 = cx - size / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = PIGMENT.diepHi;
  ctx.fillRect(x0, top, size, size);
  ctx.strokeStyle = PIGMENT.mucFaint;
  ctx.lineWidth = 2;
  ctx.strokeRect(x0, top, size, size);
  ctx.fillStyle = PIGMENT.muc;
  for (let y = 0; y < matrix.size; y += 1) {
    for (let x = 0; x < matrix.size; x += 1) {
      if (!matrix.modules[y][x]) continue;
      // Ceil, so neighbouring modules meet instead of leaving hairlines a scanner has to guess at.
      ctx.fillRect(x0 + (x + quiet) * cell, top + (y + quiet) * cell, Math.ceil(cell), Math.ceil(cell));
    }
  }
  ctx.restore();
}

/**
 * The card the film opens on.
 *
 * A trailer's first frame is its poster — it is what a player sees before they press play, and what
 * every thumbnail is cut from. This one opened on the dip to paper that fades the first shot in, so
 * the poster frame was a blank sheet.
 *
 * It is the game's own launch splash, rebuilt here from the same parts: the river emblem, the name
 * printed twice a couple of units apart (a woodblock pulled twice, not a drop shadow — which is why
 * the offset is #301509 and not a grey), the gloss under it, and the rule. Same construction as
 * `index.html`'s splash and `MenuScene.renderTitle`, so the film opens on the thing the game opens
 * on.
 */
function intro(alpha) {
  if (alpha <= 0) return;
  const mid = H * 0.47;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = PIGMENT.diep;
  ctx.fillRect(0, 0, W, H);

  if (emblem.naturalWidth) {
    const width = 380;
    const height = width * (emblem.naturalHeight / emblem.naturalWidth);
    ctx.drawImage(emblem, W / 2 - width / 2, mid - height - 40, width, height);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const name = 'VẠN THẮNG';
  ctx.font = '700 118px "Source Serif 4", Georgia, serif';
  ctx.fillStyle = '#301509';
  ctx.fillText(name, W / 2 + 5, mid + 82);      // the second pull, off register
  ctx.fillStyle = PIGMENT.muc;
  ctx.fillText(name, W / 2, mid + 78);

  ctx.font = '400 36px "Be Vietnam Pro", system-ui, sans-serif';
  ctx.fillStyle = PIGMENT.mucSoft;
  ctx.fillText('T E N   T H O U S A N D   V I C T O R I E S', W / 2, mid + 168);

  ctx.fillStyle = PIGMENT.son;
  ctx.fillRect(W / 2 - 90, mid + 226, 180, 4);
  ctx.restore();
}

/**
 * One composed frame.
 *
 * `zoom` crops the source rather than scaling the game: at 1.0 the whole 1170-wide capture is
 * fitted to the 1080-wide sheet (a downscale, so it stays crisp) and at 1.083 the crop is the
 * sheet 1:1. That is the whole travel available, and it is enough for a push that reads without
 * ever softening a letter.
 */
window.__compose = async (spec) => {
  if (spec.frame !== loaded) await load(spec.frame);
  const zoom = spec.zoom ?? 1;
  const cropW = SRC_W / zoom;
  const cropH = cropW * (H / W);
  const cropX = (image.width - cropW) * (0.5 + (spec.ax ?? 0));
  const cropY = (image.height - cropH) * (0.5 + (spec.ay ?? 0));
  const scale = W / cropW;

  ctx.fillStyle = PIGMENT.diep;
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(image, cropX, cropY, cropW, cropH, 0, 0, W, H);

  if (spec.ripple) ripple(spec.ripple, scale, cropX, cropY);
  if (spec.caption) caption(spec.caption);
  if (spec.end) endCard(spec.end, spec.lang);

  // The dip to paper between chapters. After the lettering, so it takes that with it.
  if (spec.fade > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, spec.fade);
    ctx.fillStyle = PIGMENT.diep;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // The opening card goes on top of everything, the dip included. The first cut fades in *from*
  // paper, so at frame 0 the dip is at full — draw the card before it and the poster frame is a
  // blank sheet with a title underneath it.
  if (spec.intro) intro(spec.intro);

  return canvas.toDataURL('image/jpeg', 0.94);
};

/**
 * Both fonts, in both ranges, before a single frame is drawn.
 *
 * The self-hosted faces are split by `unicode-range` — a latin file and a vietnamese one — and the
 * browser only fetches the file a range actually needs. `fonts.load(font)` with no sample text asks
 * for the default range, which is the latin one, so a canvas that then draws *VẠN THẮNG* gets the
 * latin face, misses U+1EAF, and falls back per glyph: the wordmark came out as VẠN THĂ´NG, with
 * the acute sitting beside the breve instead of on it.
 *
 * Passing text is what makes the loader fetch the range that covers it. Every size the film sets
 * is listed because `fonts.load` matches on the whole shorthand, not just the family.
 */
const VIET = 'VẠN THẮNG đêểọụỹ Cố thủ Thúc quân Lịch sử Việt Nam';
await emblemReady;
await document.fonts.ready;
await Promise.all([
  ...['700 118px', '700 56px', '700 48px', '700 42px', '600 54px', '600 46px', 'italic 600 36px']
    .map((face) => document.fonts.load(`${face} "Source Serif 4"`, VIET)),
  ...['600 44px', '600 40px', '400 40px', '400 38px', '400 32px', '400 36px']
    .map((face) => document.fonts.load(`${face} "Be Vietnam Pro"`, VIET)),
]);
window.__composeReady = true;
</script>
</body>
</html>
